<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<title>Atendimento · CRM Bigteck</title>
<link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
<div class="pagina">
<div class="shell">

  <nav class="rail" aria-label="Menu principal">
    <span class="rail-logo"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" role="img" aria-label="Bigteck Atendimento"><path d="M4.5 14v-2a7.5 7.5 0 0115 0v2" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"></path><rect x="2.6" y="13.4" width="4.4" height="6.2" rx="1.4" stroke="#FFFFFF" stroke-width="2.4"></rect><rect x="17" y="13.4" width="4.4" height="6.2" rx="1.4" stroke="#FFFFFF" stroke-width="2.4"></rect><path d="M19.2 19.6v.7a2.2 2.2 0 01-2.2 2.2H13" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"></path></svg></span>
    <div class="rail-menu">
      <button type="button" class="rail-btn" title="Painel" data-modulo="Painel"><span class="ic" data-ic="painel" data-ic-anim><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect></svg></span></button>
      <button type="button" class="rail-btn" title="Clientes" data-modulo="Clientes"><span class="ic" data-ic="clientes" data-ic-anim><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 00-3-3.87"></path></svg></span></button>
      <button type="button" class="rail-btn ativo" title="Atendimento"><span class="ic" data-ic="conversas"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 12a8 8 0 01-11.6 7.1L4 20.5l1.4-4.9A8 8 0 1120.5 12z"></path><path d="M8.8 10.4h6.4"></path><path d="M8.8 13.8h4.2"></path></svg></span><span class="rail-badge" id="rail-badge">0</span></button>
      <span class="rail-sep"></span>
      <button type="button" class="rail-btn" title="Relatórios" data-modulo="Relatórios"><span class="ic" data-ic="relatorios" data-ic-anim><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M3 3v18h18"></path><path d="M18 17V9"></path><path d="M13 17V5"></path><path d="M8 17v-3"></path></svg></span></button>
      <button type="button" class="rail-btn" id="btn-config" title="Configurações"><span class="ic" data-ic="configuracoes" data-ic-anim><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 00.3 1.9 2 2 0 11-2.8 2.8 1.7 1.7 0 00-2.9 1.2 2 2 0 11-4 0 1.7 1.7 0 00-2.9-1.2 2 2 0 11-2.8-2.8A1.7 1.7 0 002.6 14a2 2 0 110-4 1.7 1.7 0 001.2-2.9 2 2 0 112.8-2.8A1.7 1.7 0 0010 2.6a2 2 0 114 0 1.7 1.7 0 002.9 1.2 2 2 0 112.8 2.8A1.7 1.7 0 0021.4 10a2 2 0 110 4 1.7 1.7 0 00-2 1z"></path></svg></span></button>
    </div>
    <div class="rail-rodape">
      <button type="button" class="rail-avatar" id="btn-usuario" title="Minha conta" aria-haspopup="true">…</button>
      <div class="menu-usuario" id="menu-usuario" hidden>
        <strong id="menu-nome"></strong>
        <span class="email" id="menu-email"></span>
        <a class="btn-suave trocar-atendente" href="/escolher-atendente">Trocar atendente</a>
        <form method="post" action="/logout"><button type="submit" class="btn-suave">Sair</button></form>
      </div>
    </div>
  </nav>

  <main class="conteudo">

    <div class="area">
      <aside class="cartao sidebar" id="sidebar" aria-label="Caixas de entrada e equipes"><div class="esqueleto esq-sidebar" aria-hidden="true"><span class="esq rotulo-esq"></span><span class="esq-nav"><span class="esq icone"></span><span class="esq linha" style="width:52%"></span><span class="esq cont"></span></span><span class="esq-nav"><span class="esq icone"></span><span class="esq linha" style="width:70%"></span><span class="esq cont"></span></span><span class="esq-nav"><span class="esq icone"></span><span class="esq linha" style="width:62%"></span><span class="esq cont"></span></span><span class="esq separador-esq"></span><span class="esq rotulo-esq"></span><span class="esq-nav"><span class="esq ponto"></span><span class="esq linha" style="width:58%"></span><span class="esq cont"></span></span><span class="esq-nav"><span class="esq ponto"></span><span class="esq linha" style="width:60%"></span><span class="esq cont"></span></span><span class="esq separador-esq"></span><span class="esq rotulo-esq"></span><span class="esq-membro"><span class="esq avatar-esq"></span><span class="esq-coluna"><span class="esq linha" style="width:64%"></span><span class="esq linha curta" style="width:40%"></span></span></span><span class="esq-membro"><span class="esq avatar-esq"></span><span class="esq-coluna"><span class="esq linha" style="width:56%"></span><span class="esq linha curta" style="width:36%"></span></span></span><span class="esq-membro"><span class="esq avatar-esq"></span><span class="esq-coluna"><span class="esq linha" style="width:70%"></span><span class="esq linha curta" style="width:38%"></span></span></span><span class="esq-membro"><span class="esq avatar-esq"></span><span class="esq-coluna"><span class="esq linha" style="width:50%"></span><span class="esq linha curta" style="width:34%"></span></span></span></div></aside>

      <section class="cartao lista" aria-label="Conversas">
        <div class="lista-topo">
          <div class="lista-cabecalho">
            <div class="lista-info">
              <span class="lista-titulo" id="lista-titulo">Todas as conversas</span>
              <span class="lista-sub" id="lista-sub">—</span>
            </div>
            <button type="button" class="btn-quadrado hov" id="btn-filtros" title="Configurações da lista" aria-label="Configurações da lista" aria-haspopup="menu" aria-expanded="false"><span class="ic" data-ic="filtros"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 5h18"></path><path d="M6 12h12"></path><path d="M10 19h4"></path></svg></span></button>
          </div>
          <div class="busca">
            <span class="ic" data-ic="buscar"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#4C6355" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><path d="M21 21l-4.3-4.3"></path></svg></span>
            <input type="search" id="busca" placeholder="Buscar por nome, celular ou PIN" aria-label="Buscar conversa" autocomplete="off">
          </div>
        </div>
        <div class="rolagem conversas" id="conversas"><div class="esqueleto esq-conversas" aria-hidden="true"><span class="esq-conversa"><span class="esq avatar-esq grande"></span><span class="esq-coluna"><span class="esq-topo-item"><span class="esq linha" style="width:46%"></span><span class="esq linha curta" style="width:44px"></span></span><span class="esq linha" style="width:78%"></span><span class="esq selo"></span></span></span><span class="esq-conversa"><span class="esq avatar-esq grande"></span><span class="esq-coluna"><span class="esq-topo-item"><span class="esq linha" style="width:40%"></span><span class="esq linha curta" style="width:44px"></span></span><span class="esq linha" style="width:62%"></span><span class="esq selo"></span></span></span><span class="esq-conversa"><span class="esq avatar-esq grande"></span><span class="esq-coluna"><span class="esq-topo-item"><span class="esq linha" style="width:52%"></span><span class="esq linha curta" style="width:44px"></span></span><span class="esq linha" style="width:70%"></span><span class="esq selo"></span></span></span><span class="esq-conversa"><span class="esq avatar-esq grande"></span><span class="esq-coluna"><span class="esq-topo-item"><span class="esq linha" style="width:36%"></span><span class="esq linha curta" style="width:44px"></span></span><span class="esq linha" style="width:58%"></span><span class="esq selo"></span></span></span><span class="esq-conversa"><span class="esq avatar-esq grande"></span><span class="esq-coluna"><span class="esq-topo-item"><span class="esq linha" style="width:48%"></span><span class="esq linha curta" style="width:44px"></span></span><span class="esq linha" style="width:74%"></span><span class="esq selo"></span></span></span><span class="esq-conversa"><span class="esq avatar-esq grande"></span><span class="esq-coluna"><span class="esq-topo-item"><span class="esq linha" style="width:42%"></span><span class="esq linha curta" style="width:44px"></span></span><span class="esq linha" style="width:66%"></span><span class="esq selo"></span></span></span><span class="esq-conversa"><span class="esq avatar-esq grande"></span><span class="esq-coluna"><span class="esq-topo-item"><span class="esq linha" style="width:50%"></span><span class="esq linha curta" style="width:44px"></span></span><span class="esq linha" style="width:60%"></span><span class="esq selo"></span></span></span></div></div>
      </section>

      <section class="cartao chat" id="chat" aria-label="Conversa">
        <div class="esqueleto esq-chat" aria-hidden="true"><span class="esq-chat-topo"><span class="esq avatar-esq grande"></span><span class="esq-coluna"><span class="esq linha" style="width:160px"></span><span class="esq linha curta" style="width:90px"></span></span></span><span class="esq-mensagens"><span class="esq balao-esq entrada" style="width:38%"></span><span class="esq balao-esq entrada" style="width:26%"></span><span class="esq balao-esq saida" style="width:44%"></span><span class="esq balao-esq saida" style="width:30%"></span><span class="esq balao-esq entrada" style="width:22%"></span><span class="esq balao-esq saida" style="width:36%"></span><span class="esq balao-esq entrada" style="width:48%"></span></span><span class="esq-compositor"><span class="esq campo-esq"></span><span class="esq-botoes"><span class="esq quadrado"></span><span class="esq quadrado"></span><span class="esq quadrado"></span><span class="esq botao-esq"></span></span></span></div><span class="somente-leitor" role="status">Carregando conversas…</span>
      </section>

      <aside class="cartao painel" id="painel" aria-label="Dados do cliente"><div class="esqueleto esq-painel" aria-hidden="true"><span class="esq-chat-topo"><span class="esq quadrado grande"></span><span class="esq linha" style="width:140px"></span></span><span class="esq-painel-corpo"><span class="esq campo-esq alto"></span><span class="esq bloco-esq"></span><span class="esq rotulo-esq"></span><span class="esq campo-esq alto tracejado"></span><span class="esq linha" style="width:70%"></span><span class="esq linha" style="width:45%"></span></span></div></aside>
    </div>

    <div class="area config" id="area-config" hidden>
      <aside class="cartao config-menu" id="config-menu" aria-label="Menu das configurações"></aside>
      <section class="cartao config-painel" id="config-painel" aria-label="Configurações"></section>
    </div>
  </main>

</div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

</body>
</html>
