<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atendimento · CRM Bigteck</title>
<link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/app.css">
</head>
<body>
<div class="pagina">
<div class="shell">

  <nav class="rail" aria-label="Menu principal">
    <span class="rail-logo"><svg width="24" height="24" viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="23" stroke="#FFFFFF" stroke-width="10" opacity=".38"></circle><path d="M55 32a23 23 0 01-36 19" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round"></path></svg></span>
    <div class="rail-menu">
      <button type="button" class="rail-btn" title="Painel" data-modulo="Painel"><span class="ic" data-ic="painel" data-ic-anim><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect></svg></span></button>
      <button type="button" class="rail-btn" title="Empresas" data-modulo="Empresas"><span class="ic" data-ic="empresas" data-ic-anim><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M3 21V7l9-4 9 4v14"></path><path d="M9 21v-8h6v8"></path></svg></span></button>
      <button type="button" class="rail-btn" title="Clientes" data-modulo="Clientes"><span class="ic" data-ic="clientes" data-ic-anim><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M16 21v-2a4 4 0 00-4-4H6a4 4 0 00-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 00-3-3.87"></path></svg></span></button>
      <button type="button" class="rail-btn ativo" title="Atendimento"><span class="ic" data-ic="atendimento" data-ic-anim><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M21 11.5a8.4 8.4 0 01-9 8.4 8.9 8.9 0 01-3.8-.9L3 21l1.9-5.1A8.4 8.4 0 0121 11.5z"></path></svg></span><span class="rail-badge" id="rail-badge">0</span></button>
      <button type="button" class="rail-btn" title="Financeiro" data-modulo="Financeiro"><span class="ic" data-ic="financeiro" data-ic-anim><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"></rect><path d="M2 10h20"></path></svg></span></button>
      <span class="rail-sep"></span>
      <button type="button" class="rail-btn" title="Vendas" data-modulo="Vendas"><span class="ic" data-ic="vendas" data-ic-anim><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M22 7l-8.5 8.5-5-5L2 17"></path><polyline points="16 7 22 7 22 13"></polyline></svg></span></button>
      <button type="button" class="rail-btn" title="Relatórios" data-modulo="Relatórios"><span class="ic" data-ic="relatorios" data-ic-anim><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M3 3v18h18"></path><path d="M18 17V9"></path><path d="M13 17V5"></path><path d="M8 17v-3"></path></svg></span></button>
      <button type="button" class="rail-btn" title="Configurações" data-modulo="Configurações"><span class="ic" data-ic="configuracoes" data-ic-anim><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 00.3 1.9 2 2 0 11-2.8 2.8 1.7 1.7 0 00-2.9 1.2 2 2 0 11-4 0 1.7 1.7 0 00-2.9-1.2 2 2 0 11-2.8-2.8A1.7 1.7 0 002.6 14a2 2 0 110-4 1.7 1.7 0 001.2-2.9 2 2 0 112.8-2.8A1.7 1.7 0 0010 2.6a2 2 0 114 0 1.7 1.7 0 002.9 1.2 2 2 0 112.8 2.8A1.7 1.7 0 0021.4 10a2 2 0 110 4 1.7 1.7 0 00-2 1z"></path></svg></span></button>
    </div>
    <div class="rail-rodape">
      <button type="button" class="rail-avatar" id="btn-usuario" title="Minha conta" aria-haspopup="true">…</button>
      <div class="menu-usuario" id="menu-usuario" hidden>
        <strong id="menu-nome"></strong>
        <span class="email" id="menu-email"></span>
        <form method="post" action="/logout"><button type="submit" class="btn-suave">Sair</button></form>
      </div>
    </div>
  </nav>

  <main class="conteudo">
    <header class="topo">
      <div class="topo-titulo">
        <h1>Atendimento</h1>
        <span class="topo-sub" id="topo-sub">Carregando…</span>
      </div>
      <div class="chip-canal whatsapp" title="Integração com WhatsApp: em breve (modo demonstração)">
        <span class="icone"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#0A7A42" stroke-width="2.2"><path d="M21 11.5a8.4 8.4 0 01-9 8.4 8.9 8.9 0 01-3.8-.9L3 21l1.9-5.1A8.4 8.4 0 0121 11.5z"></path></svg></span>
        <span>WhatsApp</span><span class="ponto"></span>
      </div>
      <div class="chip-canal telegram" title="Integração com Telegram: em breve (modo demonstração)">
        <span class="icone"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#1D6FA5" stroke-width="2.2"><path d="M21 4L3 11l6 2 2 6z"></path><path d="M21 4l-10 9"></path></svg></span>
        <span>Telegram</span><span class="ponto"></span>
      </div>
      <button type="button" class="btn-branco hov" id="btn-conectar"><span class="ic" data-ic="mais"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg></span>Conectar canal</button>
    </header>

    <div class="area">
      <aside class="cartao sidebar" id="sidebar" aria-label="Caixas de entrada e equipes"></aside>

      <section class="cartao lista" aria-label="Conversas">
        <div class="lista-topo">
          <div class="lista-cabecalho">
            <div class="lista-info">
              <span class="lista-titulo" id="lista-titulo">Todas as conversas</span>
              <span class="lista-sub" id="lista-sub">—</span>
            </div>
            <button type="button" class="btn-quadrado hov" id="btn-filtros" title="Filtros"><span class="ic" data-ic="filtros"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 5h18"></path><path d="M6 12h12"></path><path d="M10 19h4"></path></svg></span></button>
          </div>
          <div class="busca">
            <span class="ic" data-ic="buscar"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#4C6355" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><path d="M21 21l-4.3-4.3"></path></svg></span>
            <input type="search" id="busca" placeholder="Buscar cliente, CNPJ ou protocolo" aria-label="Buscar conversa" autocomplete="off">
          </div>
        </div>
        <div class="rolagem conversas" id="conversas"></div>
      </section>

      <section class="cartao chat" id="chat" aria-label="Conversa">
        <div class="chat-vazio"><strong>Carregando conversas…</strong></div>
      </section>

      <aside class="cartao painel" id="painel" aria-label="Dados do cliente"></aside>
    </div>
  </main>

</div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/vendor/lottie_light.min.js" defer></script>
<script type="module" src="/assets/js/atendimento.js"></script>
</body>
</html>
