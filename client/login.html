<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · CRM Atendimento</title>
<link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/app.css">
<link rel="stylesheet" href="/assets/css/acesso.css">
</head>
<body data-pagina="login">
<div class="acesso">
  <aside class="hero">
    <div class="hero-glow"></div>
    <a class="marca" href="/login">
      <span class="logo"><svg width="27" height="27" viewBox="0 0 24 24" fill="none" role="img" aria-label="Bigteck Atendimento"><path d="M4.5 14v-2a7.5 7.5 0 0115 0v2" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"></path><rect x="2.6" y="13.4" width="4.4" height="6.2" rx="1.4" stroke="#FFFFFF" stroke-width="2.2"></rect><rect x="17" y="13.4" width="4.4" height="6.2" rx="1.4" stroke="#FFFFFF" stroke-width="2.2"></rect><path d="M19.2 19.6v.7a2.2 2.2 0 01-2.2 2.2H13" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"></path></svg></span>
      <span><span class="nome">Bigteck</span><span class="sub">Atendimento</span></span>
    </a>
    <div class="hero-conteudo">
      <span class="hero-badge" id="hero-badge">Equipe Bigteck</span>
      <h1 id="hero-titulo">Central de atendimento.</h1>
      <p id="hero-texto">WhatsApp e Telegram no mesmo inbox, com a ficha do cliente ao lado da conversa.</p>
    </div>
    <span class="hero-rodape">Acesso restrito à equipe de atendimento.</span>
  </aside>
  <main class="formulario">
    <div class="formulario-miolo">
      <div class="titulo"><h2>Acesse sua conta</h2><p>Bem-vindo de volta</p></div>
      <form id="form" class="campos" method="post" action="/login" novalidate>
        <input type="hidden" name="next" id="next" value="/">
        <div class="aviso erro" id="erro" hidden role="alert"></div>
        <div class="campo">
          <div class="campo-cab"><label for="email">E-mail corporativo</label></div>
          <div class="entrada">
            <span class="ic" data-ic="email"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg></span>
            <input type="email" id="email" name="email" placeholder="nome@empresa.com.br" autocomplete="username" required autofocus>
            
          </div>
        </div>
        <div class="campo">
          <div class="campo-cab"><label for="senha">Senha</label><a href="/recuperar">Esqueceu a senha?</a></div>
          <div class="entrada">
            <span class="ic" data-ic="pin"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="10" rx="2"></rect><path d="M8 10V7a4 4 0 018 0v3"></path></svg></span>
            <input type="password" id="senha" name="senha" placeholder="••••••••" autocomplete="current-password" required>
            <button type="button" class="olho" aria-label="Mostrar senha" title="Mostrar senha"><span class="ic" data-ic="olho"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></span></button>
          </div>
        </div>
        <label class="marcar"><input type="checkbox" name="lembrar" id="lembrar" value="1"><span>Manter conectado neste computador</span></label>
        <button type="submit" class="btn-acesso" id="btn">Entrar</button>
        <div class="ou">ou</div>
        <button type="button" class="btn-google hov" id="btn-google"><svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.9h5.4a4.6 4.6 0 01-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.4z"></path><path fill="#34A853" d="M12 22c2.7 0 4.9-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.7-5.6-4.1H3.1v2.6A10 10 0 0012 22z"></path><path fill="#FBBC05" d="M6.4 14c-.2-.6-.3-1.3-.3-2s.1-1.4.3-2V7.4H3.1a10 10 0 000 9.2z"></path><path fill="#EA4335" d="M12 5.9c1.5 0 2.8.5 3.8 1.5l2.8-2.8A10 10 0 003.1 7.4L6.4 10c.8-2.4 3-4.1 5.6-4.1z"></path></svg>Entrar com Google</button>
        <div class="aviso info" id="info" hidden></div>
        <span class="nota-form">Recebeu um convite por e-mail? <a class="link" href="/convite">Criar conta</a></span>
      </form>
    </div>
    <span class="rodape-form">© 2026 Bigteck</span>
  </main>
</div>
<script type="module" src="/assets/js/acesso.js"></script>
</body>
</html>
