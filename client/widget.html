<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<title>Atendimento</title>
<link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/widget.css">
</head>
<body>
  <main class="janela">
    <header class="topo">
      <span class="marca">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4.5 14v-2a7.5 7.5 0 0115 0v2"></path>
          <rect x="2.6" y="13.4" width="4.4" height="6.2" rx="1.4"></rect>
          <rect x="17" y="13.4" width="4.4" height="6.2" rx="1.4"></rect>
          <path d="M19.2 19.6v.7a2.2 2.2 0 01-2.2 2.2H13"></path>
        </svg>
      </span>
      <div class="titulo">
        <strong id="titulo">Atendimento</strong>
        <span id="subtitulo">Costumamos responder em poucos minutos</span>
      </div>
      <button type="button" class="fechar" id="btn-fechar" aria-label="Fechar conversa">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6L6 18"></path><path d="M6 6l12 12"></path></svg>
      </button>
    </header>

    <div class="mensagens" id="mensagens" aria-live="polite">
      <div class="carregando" id="estado">Abrindo a conversa…</div>
    </div>

    <aside class="aviso-horario" id="aviso-horario" aria-live="polite" hidden>
      <span class="aviso-horario-icone" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
      </span>
      <div><strong id="aviso-horario-titulo"></strong><p id="aviso-horario-texto"></p></div>
    </aside>

    <form class="compositor" id="form">
      <input type="file" id="arquivo" hidden>
      <button type="button" class="anexar" id="btn-anexar" aria-label="Anexar arquivo" title="Anexar arquivo" disabled>
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5l-8.8 8.8a5 5 0 01-7.1-7.1l9-9a3.4 3.4 0 014.8 4.8l-9 9a1.8 1.8 0 01-2.5-2.5l8.3-8.3"></path></svg>
      </button>
      <textarea id="texto" rows="1" maxlength="4000" placeholder="Escreva sua mensagem…" aria-label="Sua mensagem" disabled></textarea>
      <button type="submit" id="enviar" aria-label="Enviar" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"></path><path d="M22 2l-7 20-4-9-9-4 20-7z"></path></svg>
      </button>
    </form>
  </main>
  <script type="module" src="/assets/js/widget-chat.js"></script>
</body>
</html>
